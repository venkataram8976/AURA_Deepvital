<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – AURA</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/app.js" defer></script>
</head>
<body class="login-page">
  <header class="header">
    <div class="container header-inner">
      <a class="logo-link" href="index.html" aria-label="AURA home">
        <img src="assets/logo.svg" alt="AURA Logo" class="logo">
      </a>
    </div>
  </header>
  <main>
    <div class="container" style="max-width:420px; margin-top:3rem;">
      <div class="card">
        <h1 style="margin-bottom:1rem;">Forgot password?</h1>
        <p>For this GitHub Pages demo, password recovery is not connected to a secure authentication service.</p>
        <p style="margin-top:1rem;">Please contact the AURA administrator to reset your account, or return to login.</p>
        <a href="login.html" class="btn-primary" style="display:block; text-align:center; margin-top:1.5rem;">Back to login</a>
      </div>
    </div>
  </main>
</body>
</html>
