<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – AURA</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- JS -->
  <script src="js/api.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/app.js" defer></script>
</head>

<body class="register-page">

<!-- ================= HEADER (LOGO ONLY) ================= -->
<header class="header">
  <div class="container header-inner">
    <a href="index.html" class="logo-link">
      <img src="assets/logo.svg" alt="AURA Logo" class="logo">
    </a>
  </div>
</header>

<!-- ================= MAIN ================= -->
<main>
  <div class="container" style="max-width:420px; margin-top:3rem;">
    <div class="card">
      <h1 style="margin-bottom:1rem;">Create Account</h1>

      <form onsubmit="event.preventDefault(); Auth.register();">

        <div style="margin-bottom:1rem;">
          <label>Name</label>
          <input type="text" id="registerName"
                 placeholder="Enter your name"
                 style="width:100%; padding:0.5rem;" required>
        </div>

        <div style="margin-bottom:1rem;">
          <label>Email</label>
          <input type="email" id="registerEmail"
                 placeholder="Enter your email"
                 style="width:100%; padding:0.5rem;" required>
        </div>

        <div style="margin-bottom:1.2rem;">
          <label>Password</label>
          <input type="password" id="registerPassword"
                 placeholder="Create a password"
                 style="width:100%; padding:0.5rem;" required>
        </div>
        

        <!-- Terms Checkbox -->
        <div style="margin-bottom:1.2rem; font-size:0.85rem;">
          <label style="display:flex; gap:8px; align-items:flex-start;">
            <input type="checkbox" id="termsCheck" required>
            <span>
              I agree to the
              <a href="terms.html" style="color:#4f46e5;">Terms & Conditions</a>
              and
              <a href="privacy.html" style="color:#4f46e5;">Privacy Policy</a>
            </span>
          </label>
        </div>

        
        <button type="submit" class="btn-primary" style="width:100%;">
          Register
        </button>

      </form>

      <p style="margin-top:1rem; font-size:0.9rem;">
        Already have an account?
        <a href="login.html" style="color:#4f46e5; text-decoration:none;">
          Login
        </a>
      </p>
    </div>
  </div>
</main>

</body>
</html>
